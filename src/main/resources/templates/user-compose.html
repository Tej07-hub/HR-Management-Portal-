<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org" th:replace="~{user-base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
	<body>
		<section>
			<div class="row mt-3">
				<div class="col-md-8 offset-md-2">
					<div class="card">
						<div class="card-body">
							<form th:action="@{/compose}"  method="post">
								    
								<div class="mt-3">
								        <label class="form-label">Subject</label>
								        <input type="text"
								               name="subject"
								               class="form-control"
								               required="required">
								    </div>
								    
									<div class="mt-3">
									       <label class="form-label">Write Here</label>
									       <textarea rows="5"
									                 name="text"
									                 class="form-control"
									                 required></textarea>
									   </div>

									   <div class="mt-3 container text-center">
									       <input type="submit"
									              value="Post"
									              class="btn btn-primary"
									              style="border-radius: 25px; background-color: black; width: 40%;">
									   </div>
								    
								 </form>
								
					</div>
				</div>
			</div>
		</section>
		
	</body>
</html>
